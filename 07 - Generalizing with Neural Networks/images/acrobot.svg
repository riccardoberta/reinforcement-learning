<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
<title id="title">Acrobot: initial configuration and successful swing-up</title>
<desc id="desc">Two equal-length links connected to a fixed, unactuated pivot. The joint between the links receives torque minus one, zero, or plus one. The goal is to raise the free end more than one link length above the pivot. Step reward minus one, successful terminal reward zero.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97825"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#64748b" stroke-width="1.5"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b43}.leader{fill:none;stroke:#94a3b8;stroke-width:1.8}.link{stroke:#3478b8;stroke-width:17;stroke-linecap:round}</style>
<rect width="1400" height="1040" fill="white"/>
<text x="54" y="68" font-size="42" font-weight="700">Acrobot</text>
<text x="54" y="111" font-size="24" fill="#526479">Swing the free end above the target height</text>
<rect x="48" y="155" width="626" height="748" rx="18" fill="#f8fafc" stroke="#dce5ee"/>
<rect x="726" y="155" width="626" height="748" rx="18" fill="#f8fafc" stroke="#dce5ee"/>
<text x="82" y="203" font-size="25" font-weight="700">Initial configuration</text>
<text x="82" y="237" font-size="20" fill="#526479">Both links start near the hanging position</text>
<text x="760" y="203" font-size="25" font-weight="700">Successful swing-up</text>
<text x="760" y="237" font-size="20" fill="#526479">The free end crosses the target height</text>

<line x1="82.00" y1="350.00" x2="640.00" y2="350.00" stroke="#4f936e" stroke-width="2" stroke-dasharray="9 8"/>
<text x="82" y="327" font-size="21" fill="#367955">Target height</text>
<line x1="760.00" y1="350.00" x2="1318.00" y2="350.00" stroke="#4f936e" stroke-width="2" stroke-dasharray="9 8"/>
<text x="760" y="327" font-size="21" fill="#367955">Target height</text>
<line x1="350.00" y1="500.00" x2="350.00" y2="650.00" class="link"/>
<line x1="350.00" y1="650.00" x2="350.00" y2="800.00" class="link"/>
<rect x="322" y="476" width="56" height="10" fill="url(#hatch)"/>
<line x1="322.00" y1="486.00" x2="378.00" y2="486.00" stroke="#475569" stroke-width="3"/>
<line x1="350.00" y1="486.00" x2="350.00" y2="500.00" stroke="#475569" stroke-width="4"/>
<circle cx="350.00" cy="500.00" r="9" fill="white" stroke="#172b43" stroke-width="3"/>
<circle cx="350.00" cy="650.00" r="11" fill="#fff7ed" stroke="#d97825" stroke-width="3.5"/>
<circle cx="350.00" cy="800.00" r="8" fill="#172b43"/>
<path d="M 320.00,639.00 A 32,32 0 1 1 342.00,681.00" fill="none" stroke="#d97825" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="990.00" y1="500.00" x2="1086.42" y2="385.09" class="link"/>
<line x1="1086.42" y1="385.09" x2="1149.81" y2="249.15" class="link"/>
<rect x="962" y="476" width="56" height="10" fill="url(#hatch)"/>
<line x1="962.00" y1="486.00" x2="1018.00" y2="486.00" stroke="#475569" stroke-width="3"/>
<line x1="990.00" y1="486.00" x2="990.00" y2="500.00" stroke="#475569" stroke-width="4"/>
<circle cx="990.00" cy="500.00" r="9" fill="white" stroke="#172b43" stroke-width="3"/>
<circle cx="1086.42" cy="385.09" r="11" fill="#fff7ed" stroke="#d97825" stroke-width="3.5"/>
<circle cx="1149.81" cy="249.15" r="8" fill="#172b43"/>
<path d="M 1056.42,374.09 A 32,32 0 1 1 1078.42,416.09" fill="none" stroke="#d97825" stroke-width="3" marker-end="url(#arrow)"/>
<text x="103" y="506" font-size="22">Fixed pivot</text>
<line x1="222.00" y1="500.00" x2="331.00" y2="500.00" class="leader"/>
<text x="389" y="577" font-size="22">Link 1</text>
<text x="389" y="731" font-size="22">Link 2</text>
<text x="82" y="644" font-size="22" font-weight="700" fill="#a95417">Actuated joint</text>
<text x="82" y="676" font-size="21" fill="#a95417">Torque: −1, 0, +1</text>
<line x1="263.00" y1="644.00" x2="312.00" y2="650.00" class="leader"/>
<text x="390" y="807" font-size="22">Free end</text>
<line x1="378.00" y1="800.00" x2="363.00" y2="800.00" class="leader"/>
<text x="790" y="506" font-size="22">Fixed pivot</text>
<line x1="913.00" y1="500.00" x2="971.00" y2="500.00" class="leader"/>
<circle cx="1149.81" cy="249.15" r="19" fill="#e3f2e8" stroke="#367955" stroke-width="2"/>
<circle cx="1149.81" cy="249.15" r="7" fill="#367955"/>
<text x="1160" y="300" font-size="21" fill="#367955">Free end</text>
<line x1="1165.00" y1="280.00" x2="1163.81" y2="261.15" stroke="#78a98a" stroke-width="1.8"/>
<line x1="1260.00" y1="249.15" x2="1260.00" y2="500.00" stroke="#367955" stroke-width="1.8"/>
<line x1="1251.00" y1="249.15" x2="1269.00" y2="249.15" stroke="#367955" stroke-width="1.8"/>
<line x1="1251.00" y1="500.00" x2="1269.00" y2="500.00" stroke="#367955" stroke-width="1.8"/>
<text x="1280" y="413" font-size="20" fill="#367955" transform="rotate(-90 1280 413)">h &gt; L</text>
<text x="788" y="679" font-size="22">Only the joint between the links</text>
<text x="788" y="710" font-size="22">receives a control torque.</text>
<path d="M 1100,650 L 1163,540 L 1116,406" class="leader"/>
<rect x="82" y="846" width="558" height="36" rx="9" fill="#e9eff5"/>
<text x="361" y="871" font-size="21" font-weight="700" text-anchor="middle">Step reward: −1</text>
<rect x="760" y="846" width="558" height="36" rx="9" fill="#e3f2e8"/>
<text x="1039" y="871" font-size="21" font-weight="700" text-anchor="middle" fill="#367955">Successful terminal reward: 0</text>
<text x="54" y="957" font-size="23">Goal: raise the free end more than one link length (L) above the fixed pivot.</text>
<text x="54" y="996" font-size="20" fill="#526479">The pivot is unactuated. Both links have length L.</text>
</svg>